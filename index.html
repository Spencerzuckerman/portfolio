<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spencer Zuckerman</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: #0f1724;
      --accent: #00d4ff;
      --text: #e6eef8;
    }
    html,body{height:100%;}
    body{margin:0;font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;background: #ffffff;color:var(--bg);}
    header{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px 20px;
      background: linear-gradient(90deg, #0b1220 0%, #071021 100%);
    }
    .site-title{
      margin:0;
      font-weight:800;
      font-size:clamp(1.75rem, 5vw, 3.5rem);
      letter-spacing:-0.01em;
      color:var(--text);
      text-rendering:optimizeLegibility;
      -webkit-font-smoothing:antialiased;
    }

    main{
      padding:48px 20px;
      background: #ffffff;
      min-height: calc(100vh - 160px);
    }

    /* About section — matches header's bold modern style */
    .about .container{
      max-width:900px;
      margin:0 auto;
      background: linear-gradient(180deg,#ffffff,#fbfdff);
      padding:32px;
      border-radius:12px;
      box-shadow:0 8px 30px rgba(2,6,23,0.08);
      border-left:6px solid var(--accent);
    }
    .section-title{
      margin:0 0 12px 0;
      font-weight:800;
      font-size:clamp(1.25rem, 4vw, 2rem);
      color:var(--bg);
      letter-spacing:-0.01em;
      -webkit-font-smoothing:antialiased;
    }
    .section-text{
      margin:0;
      color:#334155;
      line-height:1.6;
      font-size:1rem;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <h1 class="site-title">Spencer Zuckerman</h1>
  </header>

  <main>
    <section class="about" aria-labelledby="about-title">
      <div class="container">
        <h2 id="about-title" class="section-title">About Me</h2>
        <p class="section-text">Write a short paragraph about yourself here — this is a placeholder where you can add details about your background, skills, and interests.</p>
      </div>
    </section>

    <!-- More site content goes here -->
  </main>
</body>
</html>
